name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: pipeline
        run: python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: pipeline
        run: ruff check src tests
      - name: Test
        working-directory: pipeline
        env:
          # Tests must not require real credentials. Anything that
          # touches Supabase or external APIs lives behind fixtures.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy
        run: pytest -q
