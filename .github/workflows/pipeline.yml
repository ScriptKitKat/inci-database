name: pipeline

on:
  schedule:
    # Sunday 03:00 UTC weekly refresh
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (obf-taxonomy | wikidata | pubchem | obf-aliases | pubmed | editorial | classify | products)"
        required: true
        default: "wikidata"

jobs:
  pubchem:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.stage == 'pubchem'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: pipeline
        run: |
          python -m pip install -e ".[dev]"
      - name: Run
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m inci_pipeline.cli run pubchem

  pubmed:
    runs-on: ubuntu-latest
    needs: pubchem
    if: github.event_name == 'schedule' || github.event.inputs.stage == 'pubmed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: pipeline
        run: python -m pip install -e ".[dev]"
      - name: Run
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m inci_pipeline.cli run pubmed

  editorial:
    runs-on: ubuntu-latest
    needs: pubmed
    if: github.event_name == 'schedule' || github.event.inputs.stage == 'editorial'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: pipeline
        run: python -m pip install -e ".[dev]"
      - name: Run
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m inci_pipeline.cli run editorial
