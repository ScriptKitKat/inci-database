[project]
name = "inci-ingredient-cleanup"
version = "0.1.0"
description = "Normalized-name ETL pipeline for cleaning product-derived ingredient data."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.39",
  "certifi>=2024.8.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-slugify>=8.0",
  "supabase>=2.6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
ingredient-cleanup = "inci_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inci_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
