[project]
name = "inci-pipeline"
version = "0.1.0"
description = "Seeds and enriches the skincare ingredient database from CosIng, PubChem, PubMed, and Open Beauty Facts."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.39",
  "httpx>=0.27",
  "lxml>=5.2",
  "orjson>=3.10",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-slugify>=8.0",
  "supabase>=2.6",
  "tenacity>=8.4",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
inci-pipeline = "inci_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inci_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
